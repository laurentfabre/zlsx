name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: build / ${{ matrix.triple }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # `zig_target` is what Zig's build system accepts (`aarch64-macos`,
    # not the LLVM triple `aarch64-apple-darwin`). `triple` is the
    # conventional name used in the release archive so humans recognise
    # the binary. They differ only on macOS.
    # `dylib_dir` is `bin` on Windows (DLLs are "runtime" artefacts there)
    # and `lib` everywhere else.
    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_target: aarch64-macos
            triple: aarch64-apple-darwin
            archive_format: tar.gz
            cli_name: zlsx
            extract_images_name: zlsx-extract-images
            dylib_name: libzlsx.dylib
            dylib_dir: lib
            staticlib_name: libzlsx.a
          - zig_target: x86_64-macos
            triple: x86_64-apple-darwin
            archive_format: tar.gz
            cli_name: zlsx
            extract_images_name: zlsx-extract-images
            dylib_name: libzlsx.dylib
            dylib_dir: lib
            staticlib_name: libzlsx.a
          - zig_target: x86_64-linux-musl
            triple: x86_64-linux-musl
            archive_format: tar.gz
            cli_name: zlsx
            extract_images_name: zlsx-extract-images
            dylib_name: libzlsx.so
            dylib_dir: lib
            staticlib_name: libzlsx.a
          - zig_target: aarch64-linux-musl
            triple: aarch64-linux-musl
            archive_format: tar.gz
            cli_name: zlsx
            extract_images_name: zlsx-extract-images
            dylib_name: libzlsx.so
            dylib_dir: lib
            staticlib_name: libzlsx.a
          - zig_target: x86_64-windows-gnu
            triple: x86_64-windows-gnu
            archive_format: zip
            cli_name: zlsx.exe
            extract_images_name: zlsx-extract-images.exe
            dylib_name: zlsx.dll
            dylib_dir: bin
            staticlib_name: zlsx_static.lib
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      - name: Stage archive contents
        run: |
          STAGE="zlsx-${{ steps.ver.outputs.version }}-${{ matrix.triple }}"
          mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/include"
          cp "zig-out/bin/${{ matrix.cli_name }}" "$STAGE/bin/"
          # C2a: bundle the standalone image-extraction binary too.
          cp "zig-out/bin/${{ matrix.extract_images_name }}" "$STAGE/bin/"
          # Zig installs the shared library in `bin/` on Windows (DLLs are
          # runtime artefacts) and in `lib/` elsewhere. The import lib
          # (.lib) stays in `lib/` on Windows.
          cp "zig-out/${{ matrix.dylib_dir }}/${{ matrix.dylib_name }}" "$STAGE/lib/"
          cp "zig-out/lib/${{ matrix.staticlib_name }}" "$STAGE/lib/"
          if [ -f "zig-out/lib/zlsx.lib" ]; then cp zig-out/lib/zlsx.lib "$STAGE/lib/"; fi
          cp include/zlsx.h "$STAGE/include/"
          # THIRD_PARTY_NOTICES.md is not optional: the Unicode
          # Character Database data compiled into every binary is
          # licensed on the condition that its notice travels with
          # copies. `check_third_party_notices.sh` gates this.
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$STAGE/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Verify third-party notices are staged
        run: scripts/ci/check_third_party_notices.sh stage "$STAGE"

      - name: Create tar.gz archive
        if: matrix.archive_format == 'tar.gz'
        run: tar -czf "${STAGE}.tar.gz" "$STAGE"

      - name: Create zip archive
        if: matrix.archive_format == 'zip'
        run: zip -r "${STAGE}.zip" "$STAGE"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            zlsx-${{ steps.ver.outputs.version }}-${{ matrix.triple }}.${{ matrix.archive_format }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        run: |
          mkdir -p dist
          gh release download "v${{ steps.ver.outputs.version }}" --dir dist --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Produce SHA256SUMS
        run: |
          cd dist
          sha256sum zlsx-*.* > SHA256SUMS

      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@v3
        with:
          files: dist/SHA256SUMS
          fail_on_unmatched_files: true

  homebrew:
    name: homebrew tap
    # Must follow `checksums`: the formula's four sha256 values are read
    # from the SHA256SUMS asset that job uploads.
    needs: checksums
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Publish the formula to the tap
        # The tap is a SEPARATE repository, so `github.token` — scoped to
        # this one — cannot push to it. It needs a PAT with contents:write
        # on the tap repo, stored as HOMEBREW_TAP_TOKEN.
        #
        # Absent that secret this skips with a warning instead of failing.
        # A red release job over packaging would be worse than the stale
        # tap it replaces, and the manual path still works:
        #   scripts/publish_homebrew_tap.sh <version>
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Homebrew tap not updated::HOMEBREW_TAP_TOKEN is unset. Run scripts/publish_homebrew_tap.sh ${GITHUB_REF_NAME#v} locally, or add the secret."
            exit 0
          fi
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish_homebrew_tap.sh "${GITHUB_REF_NAME#v}"
