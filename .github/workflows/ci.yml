name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VER=0.16.0
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   T=x86_64-linux  ;;
            Linux-ARM64) T=aarch64-linux ;;
            macOS-X64)   T=x86_64-macos  ;;
            macOS-ARM64) T=aarch64-macos ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-${T}-${ZIG_VER}.tar.xz" | tar -xJ
          echo "$PWD/zig-${T}-${ZIG_VER}" >> "$GITHUB_PATH"

      - name: zig fmt --check
        run: zig fmt --check src/ tests/ unicode/ refs/ build.zig

      - name: Build (Debug)
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Unit + fuzz-smoke tests
        run: zig build test

      - name: Fetch corpus + integration tests
        run: |
          bash scripts/fetch_test_corpus.sh
          zig build test-corpus

      - name: Single-threaded build compiles
        run: zig build -Doptimize=ReleaseFast -Dsingle-threaded=true

      # Public-module gate. `tests/consumer/` is a separate package with
      # a path dependency on the repo root, so this exercises zlsx the
      # way a downstream project does — importing `zlsx` and `zlsx_pkg`
      # in one compilation, which the pre-0.16 three-module collision
      # made impossible. It writes, reads, edits and re-reads a
      # workbook, and exits non-zero on any mismatch.
      - name: Consumer co-import round-trip
        working-directory: tests/consumer
        run: |
          zig build
          ./zig-out/bin/consumer "${RUNNER_TEMP}/consumer-in.xlsx" "${RUNNER_TEMP}/consumer-out.xlsx"

  # M1a gates. Both are cheap and independent of the test matrix, so
  # they run once rather than per-OS.
  unicode-and-notices:
    name: unicode tables + third-party notices
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Asserts the notice is wired into every distribution channel.
      # No network, no toolchain — if this fails the repo is misconfigured.
      - name: Third-party notices are shipped everywhere
        run: scripts/ci/check_third_party_notices.sh repo

      # Re-derives every vendored Unicode table from its pinned inputs.
      # Tolerates a download failure (unicode.org outage must not block
      # PRs); never tolerates a digest mismatch or a table diff.
      - name: Unicode tables match their pinned inputs
        run: scripts/ci/check_unicode_tables.sh

  cross-compile:
    name: cross / ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-macos
    steps:
      - uses: actions/checkout@v6
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Cross-compile
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

  windows-runtime:
    name: windows-runtime / native test + cli + wheel smoke
    runs-on: windows-latest
    # Tier-A2 lands the Windows job in continue-on-error first so we
    # get visibility into what fails on Windows without blocking main.
    # Once the /tmp/-path migration in src/writer.zig + src/xlsx.zig
    # is complete and the suite passes natively, flip this to false.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: zig fmt --check
        run: zig fmt --check src/ tests/ unicode/ refs/ build.zig

      - name: Build (Debug)
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      # /tmp/-path migration completed in A2 phase-2 (TestTmp helper
      # in src/{writer,xlsx,c_abi,cli}.zig). Tests should now pass
      # natively on Windows; the job-level `continue-on-error: true`
      # above is a safety net during the first few green runs and
      # can be flipped to `false` once we've seen ~3 consecutive
      # passes on `windows-latest`.
      - name: Unit + fuzz-smoke tests
        run: zig build test

      - name: Fetch corpus
        shell: bash
        run: bash scripts/fetch_test_corpus.sh

      - name: Corpus integration tests
        run: zig build test-corpus

      - name: CLI smoke — list-sheets / meta / cells
        shell: bash
        run: |
          set -euo pipefail
          ./zig-out/bin/zlsx.exe list-sheets tests/corpus/frictionless_2sheets.xlsx
          ./zig-out/bin/zlsx.exe meta tests/corpus/frictionless_2sheets.xlsx
          ./zig-out/bin/zlsx.exe cells tests/corpus/frictionless_2sheets.xlsx --take 3

      - name: Stage zlsx.dll into Python binding for wheel smoke
        shell: bash
        run: |
          set -euo pipefail
          cp zig-out/bin/zlsx.dll bindings/python/zlsx/zlsx.dll

      - name: Python wheel install + import + reader smoke
        shell: bash
        working-directory: bindings/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
          python -c "import zlsx; b = zlsx.open('../../tests/corpus/frictionless_2sheets.xlsx'); print('sheets:', b.sheets); b.close()"

      - name: Pytest binding suite (best-effort)
        shell: bash
        working-directory: bindings/python
        # /tmp paths in some pytest fixtures may also break here;
        # surface the failure but do not gate the whole job on it
        # until the migration completes.
        continue-on-error: true
        run: |
          python -m pytest tests/ -q
