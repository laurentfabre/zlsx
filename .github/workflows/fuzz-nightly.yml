name: Fuzz Nightly

# B-fuzz from the post-0.2.9 roadmap. Runs the coverage-guided fuzz
# targets on a Linux x64 runner once per day. Crash artefacts are
# uploaded so a regression can be reproduced + replayed locally.
#
# THREE BUGS WERE FIXED TO GET THIS WORKING — read before editing:
#
# 1. The invocation was `zig build fuzz`, where `fuzz` is a STEP NAME.
#    Coverage-guided fuzzing needs the `--fuzz` FLAG. Without it the
#    build runner never populates `fuzz_context`, and the first
#    `coverage_id` message from the -ffuzz-instrumented test binary
#    unwrapped null and panicked inside std. That failed in ~330 ms,
#    before any fuzzing, and the workflow was red every night from
#    2026-04-29 onward — 88 consecutive runs that fuzzed nothing.
#
# 2. Zig 0.16.0 cannot compile its own test runner in `-ffuzz` mode
#    (`writeStackTrace` gets a `*builtin.StackTrace` where a
#    `*const debug.StackTrace` is required).
#
# 3. Even patched, the runner called the fuzzer ABI during the
#    discovery pass, when `fuzzer.test_i` is still `undefined` —
#    segfaulting on every target that supplies a seed corpus.
#
# 2 and 3 are fixed in `vendor/zig-test-runner/`, a copy of upstream's
# runner with two hunks changed, used ONLY by the fuzz binaries. See
# its README for the removal condition — delete it as soon as a Zig
# release fuzzes without it.
#
# Fuzzing genuinely runs now, so this job is a real gate again: a crash
# turns it red. Do NOT reintroduce a blanket "warn and exit 0" branch.
#
# Linux only: Zig 0.16.0's fuzz support is additionally broken on
# Windows (shared-memory + COFF/PE debug-info gaps) and macOS
# (Mach-O addEntryPoint crash). When upstream lands fixes, add
# matrix entries here.
#
# Cost note: zlsx is a public repo so Actions minutes are free.
# A single nightly run sized to fuzz_duration_seconds is well
# within the runner-time budget.

on:
  schedule:
    # 03:00 UTC every day (off-peak vs the Bench Regression workflow).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Fuzz duration in seconds (default 1800 = 30 min)'
        required: false
        default: '1800'

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz / ubuntu-22.04 (Linux x64)
    runs-on: ubuntu-22.04
    # Hard ceiling: regardless of input duration, never let a
    # single run exceed 90 min. Catches a runaway fuzzer trapped
    # in an instrumentation pathology before it eats the day's
    # quota.
    timeout-minutes: 90
    # Do NOT mark continue-on-error: a fuzz crash is exactly the
    # signal this workflow exists to surface. The "Run fuzz session"
    # step already maps exit codes 124/143 (timeout-killed) to
    # success internally, so non-crash runs still pass cleanly. Real
    # fuzz crashes must turn the job red; the artefact-upload step
    # uses `if: always()` so crash files are still collected.
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run fuzz session
        env:
          DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '1800' }}
        # `--fuzz` is the flag that actually enables coverage-guided
        # fuzzing; `fuzz` alone is just our step name. `--fuzz` implies
        # `--webui`, and the fuzzer runs until killed, so the wall-clock
        # cap comes from `timeout`: 124 (TERM-on-timeout) and 143
        # (SIGTERM-killed) are the healthy "ran the full session" exits.
        run: |
          set +e
          timeout --preserve-status --signal=TERM "${DURATION_SECONDS}s" \
            zig build fuzz --fuzz --webui=127.0.0.1:0 2>&1 | tee fuzz.log
          rc=${PIPESTATUS[0]}
          set -e

          if [[ "$rc" == "124" || "$rc" == "143" ]]; then
            echo "::notice::fuzz session ran the full ${DURATION_SECONDS}s with no crash"
            exit 0
          fi
          if [[ "$rc" == "0" ]]; then
            echo "::notice::fuzz session exited cleanly"
            exit 0
          fi

          # Anything else is a real failure: a genuine fuzz crash, or a
          # toolchain regression. Both must be visible.
          echo "::error::fuzz session failed (rc=$rc) — see log and crash artefacts"
          exit "$rc"

      - name: Upload crash artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: |
            .zig-cache/v/**
            zig-out/fuzz/**
          retention-days: 30
          if-no-files-found: ignore
