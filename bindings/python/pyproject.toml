[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-zlsx"
version = "0.7.0"
description = "Python binding for zlsx — fast, read-mostly .xlsx library (Zig)"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Laurent Fabre" }]
keywords = ["xlsx", "excel", "spreadsheet", "parser", "openpyxl-alternative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Homepage = "https://github.com/laurentfabre/zlsx"
Repository = "https://github.com/laurentfabre/zlsx"
Issues = "https://github.com/laurentfabre/zlsx/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
# pyarrow is not optional: pyspark's Python Data Source worker imports
# it on the read path (plan_data_source_read) and crashes without it.
spark = ["pyspark>=4.0.0", "pyarrow>=11.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["zlsx"]

[tool.hatch.build.targets.sdist]
include = ["zlsx/**", "tests/**", "README.md", "LICENSE", "pyproject.toml"]
